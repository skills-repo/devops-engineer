# 生产级 GitHub Actions CI 模板
# 设计要点：分层门禁（快的先跑）、最小权限、可复现、OIDC 免长期密钥、build once。
# 用法：复制到 .github/workflows/ci.yml，按 TODO 调整；改完用
#       python3 scripts/ci_audit.py .github/workflows --strict 自检。

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 默认只读。需要写权限的 job 单独提权，把爆炸半径关在一个 job 里。
permissions:
  contents: read

# 同一分支的新推送取消旧运行，省额度也省等待。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22.14"

jobs:
  # ── 第 1 层：秒级门禁。跑得最快、最容易挂的放最前面 ────────────────
  lint:
    name: Lint & Typecheck
    runs-on: ubuntu-24.04            # pin 具体版本，别用 -latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm                  # 依赖缓存，通常省掉 60-80% 安装时间
      - run: npm ci --prefer-offline
      - run: npm run lint
      - run: npm run typecheck

  # ── 第 2 层：分钟级门禁。与 lint 并行，互不阻塞 ────────────────────
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false                # 一个矩阵分支失败不掐掉其他分支的信息
      matrix:
        shard: [1, 2]                 # TODO: 按测试耗时调整分片数
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports: ["5432:5432"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --prefer-offline
      - run: npm test -- --shard=${{ matrix.shard }}/2 --coverage
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      - uses: actions/upload-artifact@v4
        if: always()                  # 失败时更需要这份产物
        with:
          name: coverage-${{ matrix.shard }}
          path: coverage/
          retention-days: 7

  # ── 第 3 层：构建一次，产物贯穿所有环境 ───────────────────────────
  build:
    name: Build Image
    needs: [lint, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write                 # 仅此 job 需要推镜像
      id-token: write                 # OIDC，用于免密钥签名/上云
    outputs:
      image: ${{ steps.meta.outputs.tags }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true            # 生成来源证明，供应链可审计

  # ── 第 4 层：部署。只在 main 分支，且走环境保护规则 ────────────────
  deploy:
    name: Deploy to Production
    needs: [build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: production                # 在仓库设置里配审批人 / 等待时间
      url: https://example.com        # TODO: 换成真实地址
    permissions:
      contents: read
      id-token: write                 # 用 OIDC 换云厂商短期凭据，不存长期 AK
    steps:
      - uses: actions/checkout@v4
      # TODO: 换成你的云厂商 OIDC 登录，例如：
      # - uses: aws-actions/configure-aws-credentials@v4
      #   with:
      #     role-to-assume: arn:aws:iam::<acct>:role/gha-deploy
      #     aws-region: ap-northeast-1
      - name: Deploy
        run: |
          echo "Deploying image: ${{ needs.build.outputs.image }}"
          # TODO: kubectl set image / terraform apply / 云平台 CLI

  # ── 处理不可信输入的正确姿势（PR 标题等）───────────────────────────
  # 反例：run: echo "${{ github.event.pull_request.title }}"   ← 命令注入
  # 正例：先经 env 传值，脚本里用引号包裹的变量
  pr-title-check:
    name: PR Title Convention
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Validate title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! printf '%s' "$PR_TITLE" | grep -Eq '^(feat|fix|docs|chore|refactor|test)(\(.+\))?: .+'; then
            echo "::error::PR 标题需符合 Conventional Commits，例如 'feat(api): 支持批量导入'"
            exit 1
          fi
